<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALLERY</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 150px);
            gap: 4px;
        }

        .container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .container div:nth-child(1) {
            grid-column: 1 / -1;
            grid-row: 1/ 3;
        }

        .container div:nth-child(2) {
            grid-column: 1 / 3;
            grid-row: 3/ 5;
        }
        .container div:nth-child(3) {
            grid-column: 3/ 5;
            grid-row: 3/ 5;
        }
        .container div:nth-child(4) {
            grid-column: 5/ -1;
            grid-row: 3 /4;
        }
        .container div:nth-child(5) {
            grid-column: 5/ -1;
            grid-row: 4/ 5;
        }
        .container div:nth-child(6) {
            grid-column: 1/ 3;
            grid-row:5/ -1;
        }
        .container div:nth-child(7) {
            grid-column: 3/ 3;
            grid-row: 5/ 5;
        }
        .container div:nth-child(8) {
            grid-column: 4/ 4;
            grid-row:6/7;
        }
        .container div:nth-child(9) {
             grid-column: 3/ 4;
            grid-row: 6/ 7;
        }
        .container div:nth-child(10) {
            grid-column: 4/ 5;
            grid-row: 5/ 6;
        }
        .container div:nth-child(11) {
            grid-column: 5/7;
            grid-row: 5/ 7;
        }
    </style>
</head>

<body>
    <div class="container">
        <div><img src="./images/A.jpg" alt=""></div>
        <div><img src="./images/B.jpg" alt=""></div>
        <div><img src="./images/C.jpg" alt=""></div>
        <div><img src="./images/D.jpg" alt=""></div>
        <div><img src="./images/E.jpg" alt=""></div>
        <div><img src="./images/F.jpg" alt=""></div>
        <div><img src="./images/G.jpg" alt=""></div>
        <div><img src="./images/G.jpg" alt=""></div>
        <div><img src="./images/G.jpg" alt=""></div>
        <div><img src="./images/G.jpg" alt=""></div>
        <div><img src="./images/H.jpg" alt=""></div>
    </div>
</body>

</html>
